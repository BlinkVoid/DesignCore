[project]
name = "designcore"
version = "0.1.0"
description = "Verified diagrams for documentation: draw.io, Mermaid, Excalidraw."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["diagrams", "graphviz", "mermaid", "excalidraw", "drawio", "documentation", "ai-agents"]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Software Development :: Documentation",
]

[project.scripts]
designcore = "designcore.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/designcore"]
